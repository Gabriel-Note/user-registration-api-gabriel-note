name: bygg, testa och villkora deploy

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Sätt upp java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gör Maven Wrapper körbar
        run: chmod +x ./mvnw

      - name: Bygg projektet
        run: ./mvnw -B clean compile

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: hämta koden
        uses: actions/checkout@v4

      - name: Sätt up java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gör Maven Wrapper körbar
        run: chmod +x ./mvnw

      - name: Kör test
        run: ./mvnw -B test

      - name: Ladda upp surefire-rapporter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # 'ref/heads/main' innebär att testet måste ha körts från main???????
    if: success() && github.ref == 'refs/heads/main'
    # if: success() && github.ref == 'ref/heads/workflow-testing'
    steps:
      - name: Deploy till produktion (simulerat)
        run: echo "Deployar user-registration-api till produktion"